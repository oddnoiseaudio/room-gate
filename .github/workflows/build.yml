name: Build Room Gate

on:
  push:
    branches: [main]
    tags: ['v*']       # a tag like v0.1.0 also creates a GitHub release with the finished package
  workflow_dispatch:

permissions:
  contents: write      # needed to attach release files

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --target OddnoiseRoomGate --parallel 4

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path "build/OddnoiseRoomGate_artefacts/Release/oddnoise Room Gate.exe" -DestinationPath oddnoise-Room-Gate-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: oddnoise-Room-Gate-Windows
          path: oddnoise-Room-Gate-Windows.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: oddnoise-Room-Gate-Windows.zip
